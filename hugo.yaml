baseURL: 'https://catra.top'
locale: en-us
title: Catra Dot Top
theme: ["PaperMod"]

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: posts
      name: Blog
      url: /blog/
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 11
    # - identifier: tags
    #   name: Tags
    #   url: /tags/
    #   weight: 20
    - identifier: about
      name: About
      url: /about
      weight: 40
    - identifier: search
      # parent: archives
      name: Search
      url: /search
      weight: 40

params:
  assets:
    disableHLJS: true

  ShowCodeCopyButtons: true

  mainSections:
    - blog

  homeInfoParams:
    Title: A Blog
    Content: '^^^^small'

  socialIcons:
    - name: "bluesky"
      url: "https://bsky.app/profile/catra.top"

markup:
  highlight:
    # anchorLineNos: true
    codeFences: true
    guessSyntax: true
    # lineNos: true
    # noClasses: false
    style: monokai

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
